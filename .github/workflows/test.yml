name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # weekly: catch a release that breaks installation

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        version: [latest, v0.17.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: nrc
        uses: ./
        with:
          version: ${{ matrix.version }}
      - name: The CLI runs under both names
        shell: bash
        run: |
          set -euo pipefail
          norcube --version
          nrc --version
          test -n "${{ steps.nrc.outputs.version }}"
          case "${{ matrix.version }}" in
            latest) ;;
            # The CLI prints its version without the leading "v".
            *) v="${{ matrix.version }}"; norcube --version | grep -qF "version ${v#v} " ;;
          esac
      - name: A second run reuses the tool cache
        uses: ./
        with:
          version: ${{ steps.nrc.outputs.version }}

  token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          token: nrc_ci_000000000000000000000000000000000000ab
      - name: NORCUBE_TOKEN is exported (and masked in the log)
        run: test -n "$NORCUBE_TOKEN"
      # Needs CLI v0.18.0 or later (local CI token checks).
      - name: A mistyped token is caught locally (exit 2, no request)
        run: |
          set +e
          nrc backup jobs list
          code=$?
          test "$code" -eq 2

  bad-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: bad
        uses: ./
        continue-on-error: true
        with:
          version: not-a-version
      - run: test "${{ steps.bad.outcome }}" = failure
